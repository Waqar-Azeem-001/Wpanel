name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    # Separate from the tests so one cannot hide the other: a bandit failure no longer stops the tests from running, and the deploy needs both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Static security scan (bandit, high severity only)
        run: |
          pip install bandit
          bandit -q -r apps config -lll -x "*/tests/*,*/test_*.py,apps/*/migrations"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: whpanel
          POSTGRES_USER: whpanel
          POSTGRES_PASSWORD: whpanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whpanel -d whpanel"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://whpanel:whpanel@localhost:5432/whpanel
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the secret scan below reads the whole history
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PostgreSQL 17 client tools (pg_dump must match the server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"   # pg_dump and pg_restore must both be 17, not the runner's 16
          /usr/lib/postgresql/17/bin/pg_dump --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Production settings deploy check
        env:
          SITE_URL: https://portal.example.com  # the deploy check refuses a non-https address
        run: python manage.py check --deploy --settings=config.settings.prod --fail-level ERROR

      - name: Test suite on PostgreSQL
        run: pytest

      - name: The concurrency tests really ran (none skipped)
        run: |
          pytest -rs apps/billing/tests/test_concurrency.py apps/orders/tests/test_concurrency.py apps/affiliates/tests/test_concurrency.py apps/lifecycle/tests/test_concurrency.py apps/renewals/tests/test_concurrency.py | tee concurrency.txt
          if grep -q "SKIPPED" concurrency.txt; then echo "::error::A concurrency test was skipped: it needs PostgreSQL"; exit 1; fi

      - name: Celery worker round trip via Redis
        run: |
          celery -A config worker --loglevel=INFO --concurrency=1 > celery.log 2>&1 &
          python manage.py check_celery --timeout 60
          python manage.py shell -c "from django.core.cache import cache; cache.set('ci', 'ok', 30); assert cache.get('ci') == 'ok'; print('Redis cache ok')"

      - name: Celery log
        if: always()
        run: cat celery.log || true

  deploy:
    # Only after the tests and the security scan passed, only for a push to main, and only after the reviewer on the GitHub "production" environment approves it
    # (Settings > Environments > production). DEPLOY_SSH_KEY is a secret of that environment, so no job can read it before the approval. The key can do one thing on the
    # server: send the code and ask for a deploy (see docs/deploy-setup.md). Without the secret the job still runs but changes nothing.
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://whpanel.myaiwhe.com
    concurrency: production-deploy
    env:
      DEPLOY_HOST: 62.238.96.50
      DEPLOY_USER: deploy
      DEPLOY_URL: https://whpanel.myaiwhe.com
    steps:
      - uses: actions/checkout@v4
      - name: Check for deploy key
        id: key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::DEPLOY_SSH_KEY is not set; the code was NOT deployed to the live server"
            echo "### NOT DEPLOYED: the production environment has no DEPLOY_SSH_KEY secret, so nothing was sent to the live server." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare SSH
        if: steps.key.outputs.present == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key of the production server (public information); a changed key fails the deploy.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMgSsuHyuVS7C96DtCNltcTlNddeqfISQHuD9ON2ZfGn" > ~/.ssh/known_hosts
      - name: Send the code and deploy (backup, rebuild, migrations, warm-up, all on the server)
        if: steps.key.outputs.present == 'true'
        run: |
          git archive --format=tar HEAD | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${GITHUB_SHA}"
      - name: Health check from outside
        if: steps.key.outputs.present == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$DEPLOY_URL/api/v1/health/" | grep -q '"status":"ok"'; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Health check failed after deploy"; exit 1

  notify:
    # Tells the team, through WHPanel's own email provider, how the checks went. It does NOT wait for the deploy and does NOT use the deploy secret: it has its own key
    # (NOTIFY_SSH_KEY, a repository secret) that can only send a notice. The deploy script itself announces "deployed" or "failed" from the server when it finishes.
    needs: [test, security]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 62.238.96.50
      NOTIFY_USER: notify
    steps:
      - name: Check for the notify key
        id: key
        env:
          KEY: ${{ secrets.NOTIFY_SSH_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::warning::NOTIFY_SSH_KEY is not set; no notice sent"; fi
      - name: Send the notice from the live panel
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          KEY: ${{ secrets.NOTIFY_SSH_KEY }}
          TESTS: ${{ (needs.test.result == 'success' && needs.security.result == 'success') && 'success' || 'failure' }}
          DEPLOY: ${{ (needs.test.result == 'success' && needs.security.result == 'success') && 'waiting for your approval' || 'not started' }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/notify_key && chmod 600 ~/.ssh/notify_key
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMgSsuHyuVS7C96DtCNltcTlNddeqfISQHuD9ON2ZfGn" > ~/.ssh/known_hosts
          # only plain characters go into the remote command line (the server checks them again)
          clean() { printf '%s' "$1" | head -n 1 | tr -cd '[:alnum:] ._:/#()-' | cut -c1-"$2"; }
          ssh -i ~/.ssh/notify_key -o IdentitiesOnly=yes "$NOTIFY_USER@$DEPLOY_HOST"             "notify --tests '$(clean "$TESTS" 20)' --deploy '$(clean "$DEPLOY" 40)' --sha '$(clean "$SHA" 40)' --actor '$(clean "$ACTOR" 40)' --message '$(clean "$MESSAGE" 80)' --run-url '$(clean "$RUN_URL" 200)'"
