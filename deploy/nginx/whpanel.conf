# HTTP reverse proxy for the WHpanel Docker stack.
# TLS is terminated in front of this (host Nginx/Certbot or a load balancer) until Phase 19.
# The web container is found by name on every request (Docker's own DNS, 127.0.0.11), so a rebuilt container with a new address needs no nginx restart (before, nginx kept the old address and answered 502).
resolver 127.0.0.11 valid=5s ipv6=off;

# Maintenance mode (Phase 15): the app's own staff toggle (Setup > Brand > Maintenance) creates or removes a flag
# file on every save (apps/branding/services.py:_sync_maintenance_flag_file, the web container's MAINTENANCE_FLAG_PATH).
# Checking for it here means the maintenance page is served even if Django or the database is not safely reachable
# at all (e.g. mid-deploy) - a harder, lower-level gate than the in-app middleware, which only covers the case where
# the app itself is still running. The `maintenance` volume (docker-compose.yml) is where the web container writes
# it and this container reads it from, at each container's own mount point - only the filename has to agree.
# Regenerate maintenance.html with `python manage.py render_maintenance_page` if templates/maintenance.html changes.

# Behind the host Nginx (TLS terminates there) keep its scheme and client IP; reached directly, fall back to our own.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
map $http_x_forwarded_for $fwd_for {
    default $remote_addr;
    ~.+     $http_x_forwarded_for;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
    }

    location = /maintenance.html {
        root /etc/nginx;
        internal;
    }

    location / {
        if (-f /srv/maintenance/maintenance.flag) {
            return 503;
        }
        error_page 503 /maintenance.html;

        set $whp_web http://web:8000;
        proxy_pass $whp_web;
        proxy_set_header Host $host;
        # The stack's port is published on 127.0.0.1 only, so the host Nginx is the only caller that can set these
        # (it overwrites X-Forwarded-For with the real client IP); clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
}
