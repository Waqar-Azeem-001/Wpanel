# HTTP reverse proxy for the WHpanel Docker stack.
# TLS is terminated in front of this (host Nginx/Certbot or a load balancer) until Phase 19.
upstream whpanel_web {
    server web:8000;
}

# Maintenance mode (Phase 15): the app's own staff toggle (Setup > Brand > Maintenance) creates or removes a flag
# file on every save (apps/branding/services.py:_sync_maintenance_flag_file, the web container's MAINTENANCE_FLAG_PATH).
# Checking for it here means the maintenance page is served even if Django or the database is not safely reachable
# at all (e.g. mid-deploy) - a harder, lower-level gate than the in-app middleware, which only covers the case where
# the app itself is still running. The `maintenance` volume (docker-compose.yml) is where the web container writes
# it and this container reads it from, at each container's own mount point - only the filename has to agree.
# Regenerate maintenance.html with `python manage.py render_maintenance_page` if templates/maintenance.html changes.

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
    }

    location = /maintenance.html {
        root /etc/nginx;
        internal;
    }

    location / {
        if (-f /srv/maintenance/maintenance.flag) {
            return 503;
        }
        error_page 503 /maintenance.html;

        proxy_pass http://whpanel_web;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
}
