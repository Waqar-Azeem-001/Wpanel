# HTTP reverse proxy for the Wpanel Docker stack.
# TLS is terminated in front of this (host Nginx/Certbot or a load balancer) until Phase 19.
upstream wpanel_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://wpanel_web;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
}
