services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: whpanel
      POSTGRES_USER: whpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whpanel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whpanel -d whpanel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # With REDIS_PASSWORD set (in .env) Redis asks for it; REDIS_URL then reads redis://:PASSWORD@redis:6379/0. Without it, as before (only the stack's own network can reach it).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: python manage.py migrate --noinput
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: .
    env_file: .env
    environment:
      MAINTENANCE_FLAG_PATH: /app/maintenance/maintenance.flag
      PANEL_BACKUP_DIR: /app/panel_backups
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - panel_backups:/app/panel_backups
      - static:/app/staticfiles
      - media:/app/media
      - private_media:/app/private_media
      - maintenance:/app/maintenance

  worker:
    build: .
    env_file: .env
    environment:
      PANEL_BACKUP_DIR: /app/panel_backups
    command: celery -A config worker --loglevel=INFO
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - panel_backups:/app/panel_backups
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    build: .
    env_file: .env
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/whpanel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/maintenance.html:/etc/nginx/maintenance.html:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      - maintenance:/srv/maintenance:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static:
  media:
  private_media:
  panel_backups:
  maintenance:
