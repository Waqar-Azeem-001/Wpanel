services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wpanel
      POSTGRES_USER: wpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wpanel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpanel -d wpanel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: python manage.py migrate --noinput
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: .
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - private_media:/app/private_media

  worker:
    build: .
    env_file: .env
    command: celery -A config worker --loglevel=INFO
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    build: .
    env_file: .env
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/wpanel.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static:
  media:
  private_media:
