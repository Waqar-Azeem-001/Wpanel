{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Change password" %} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="card mx-auto narrow-card"><div class="card-body p-4">
  <h1 class="h4">{% trans "Change password" %}</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/form.html" %}
    <button type="submit" class="btn btn-primary">{% trans "Change password" %}</button>
  </form>
  <p class="text-secondary mt-3 mb-0"><a href="{% url 'accounts:profile' %}">{% trans "Back to profile" %}</a></p>
</div></section>
{% endblock %}
