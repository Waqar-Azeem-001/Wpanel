{% load ui i18n %}
<div class="table-responsive">
<table class="table align-middle">
  <thead><tr><th>{% trans "Description" %}</th><th class="text-end">{% trans "Qty" %}</th><th class="text-end">{% trans "Unit price" %}</th><th class="text-end">{% trans "Amount" %}</th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr><td>{{ item.description }}</td><td class="text-end">{{ item.quantity }}</td>
        <td class="text-end">{{ item.unit_price|money }}</td><td class="text-end">{{ item.amount|money }}</td></tr>
  {% empty %}
    <tr><td colspan="4" class="text-secondary">{% trans "No lines." %}</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
