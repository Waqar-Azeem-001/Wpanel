<div class="table-wrap">
<table class="table">
  <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr><td>{{ item.description }}</td><td class="num">{{ item.quantity }}</td>
        <td class="num">{{ item.unit_price }}</td><td class="num">{{ item.amount }}</td></tr>
  {% empty %}
    <tr><td colspan="4" class="muted">No lines.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
