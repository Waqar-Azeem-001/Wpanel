<div class="faq-row" data-row>
  <input class="form-control mb-1" name="faq_q" value="{{ q }}" maxlength="200" placeholder="Question" aria-label="Question">
  <div class="d-flex gap-2"><textarea class="form-control" name="faq_a" rows="2" maxlength="1200" placeholder="Answer" aria-label="Answer">{{ a }}</textarea>
    <button class="btn btn-sm btn-outline-danger align-self-start" type="button" data-rows-remove aria-label="Remove this question"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
</div>
