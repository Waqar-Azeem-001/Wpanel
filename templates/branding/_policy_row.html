<div class="limit-row" data-row>
  <input class="form-control" name="policy_title" value="{{ title }}" maxlength="60" placeholder="Title, e.g. Terms of Services" aria-label="Policy title">
  <input class="form-control" type="url" name="policy_url" value="{{ url }}" maxlength="300" placeholder="Web address of the page" aria-label="Policy web address">
  <button class="btn btn-sm btn-outline-danger" type="button" data-rows-remove aria-label="Remove this link"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
</div>
