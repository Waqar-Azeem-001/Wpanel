<div class="limit-row" data-row>
  <input class="form-control" name="social_title" value="{{ title }}" maxlength="60" placeholder="Network, e.g. Facebook" aria-label="Social network">
  <input class="form-control" type="url" name="social_url" value="{{ url }}" maxlength="300" placeholder="Web address of your page" aria-label="Social page web address">
  <button class="btn btn-sm btn-outline-danger" type="button" data-rows-remove aria-label="Remove this link"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
</div>
