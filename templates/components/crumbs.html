{% load i18n %}
{# crumbs: [(label, url)], the last one is the current page and has no link. Drawn in the top bar of the signed-in shell. #}
<nav aria-label="{% trans 'Breadcrumb' %}">
  <ol class="breadcrumb">
    {% for label, url in breadcrumbs %}
      {% if forloop.last or not url %}<li class="breadcrumb-item active" aria-current="page">{{ label }}</li>
      {% else %}<li class="breadcrumb-item"><a href="{{ url }}">{{ label }}</a></li>{% endif %}
    {% endfor %}
  </ol>
</nav>
