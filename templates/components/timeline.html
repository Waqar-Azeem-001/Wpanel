{# events: [(when, text)] - an activity feed, newest first as given. #}
{% load ui %}
<ul class="timeline-feed">
  {% for when, text in events %}<li><small class="text-secondary">{{ when|fdatetime }}</small><div>{{ text }}</div></li>
  {% empty %}<li class="text-secondary">Nothing has happened yet.</li>{% endfor %}
</ul>
