{% load i18n %}
<ul class="rows">
  {% for c in checks %}<li>
    <span class="main"><strong>{{ c.name }}</strong><small>{{ c.detail }}</small></span>
    <span class="status-badge {% if c.ok %}is-success{% else %}is-danger{% endif %}">{% if c.ok %}{% trans "OK" %}{% else %}{% trans "Problem" %}{% endif %}</span></li>{% endfor %}
</ul>
