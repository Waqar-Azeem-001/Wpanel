{% load i18n %}
<ul class="rows">
  {% for label, n in stages %}<li><span>{{ label }}</span><strong class="tabular">{{ n }}</strong></li>{% endfor %}
  <li><a href="{% url 'lifecycle_staff:cancellations' %}">{% trans "Cancellation requests waiting" %}</a><strong class="tabular">{{ pending_cancellations }}</strong></li>
</ul>
{% if needing_attention %}<div class="panel-note text-danger">{{ needing_attention }} {% trans "cancellation(s) failed and need a retry." %}</div>{% endif %}
