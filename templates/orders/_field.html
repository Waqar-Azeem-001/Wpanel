{% load ui %}
<div class="field col-md-6">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span><span class="visually-hidden"> (required)</span>{% endif %}</label>
  {{ field|bs_field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_errors">{% for e in field.errors %}<p class="text-danger small">{{ e }}</p>{% endfor %}</div>{% endif %}
</div>
