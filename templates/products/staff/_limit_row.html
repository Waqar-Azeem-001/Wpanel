<div class="limit-row" data-row>
  <input class="form-control" name="limit_title" value="{{ title }}" maxlength="60" placeholder="Title, e.g. Email accounts" aria-label="Limit title">
  <input class="form-control" name="limit_value" value="{{ value }}" maxlength="100" placeholder="Limit (empty = unlimited)" aria-label="Limit">
  <button class="btn btn-sm btn-outline-danger" type="button" data-rows-remove aria-label="Remove this limit"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
</div>
