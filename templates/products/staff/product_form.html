{% extends "base.html" %}
{% block title %}{{ title }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="card"><div class="card-body">
  <h1>{{ title }}</h1>
  <form method="post" novalidate class="grid-form">{% csrf_token %}
    {% include "partials/form.html" %}
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% if product %}{% url 'catalog_staff:product_detail' product.slug %}{% else %}{% url 'catalog_staff:product_list' %}{% endif %}">Cancel</a>
    </div>
  </form></div>
</section>
{% endblock %}
