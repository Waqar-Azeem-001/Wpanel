{% extends "base.html" %}
{% block title %}{{ title }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <form method="post" novalidate class="grid-form">{% csrf_token %}
    {% include "partials/form.html" %}
    <div class="actions">
      <button type="submit" class="btn">Save</button>
      <a href="{% url 'catalog_staff:server_list' %}">Cancel</a>
    </div>
  </form>
</section>
{% if status_form %}
<section class="card">
  <h2>Status</h2>
  <form method="post" action="{% url 'catalog_staff:server_status' server.pk %}">{% csrf_token %}
    <div class="field">{{ status_form.status }}</div>
    <button class="btn secondary" type="submit">Update status</button>
  </form>
</section>
{% endif %}
{% endblock %}
